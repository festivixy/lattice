# lt-7b pretraining preset
model:
  name: lt-7b
  layers: 32
  d_model: 4096
  heads: 32
  rope_theta: 500000
optim:
  name: adamw
  lr: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 2000
  schedule: cosine
data:
  tokenizer: bpe-128k
  seq_len: 4096
  batch_size: 512
  shards: 4096
runtime:
  precision: bf16
  sharding: FULL_SHARD
  activation_checkpointing: true
  compile: max-autotune
